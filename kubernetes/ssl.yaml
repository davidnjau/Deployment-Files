apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  # DO NOT commit real certificates to version control.
  # Create this secret from your certificate files instead:
  #
  #   kubectl create secret tls tls-secret \
  #     --cert=path/to/fullchain.pem \
  #     --key=path/to/privkey.pem \
  #     -n default
  #
  # If using cert-manager, delete this file and create a Certificate resource instead.
  # The fields below are intentionally left blank.
  tls.crt: ""
  tls.key: ""
