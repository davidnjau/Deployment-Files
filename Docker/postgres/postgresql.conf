# postgresql.conf — Production-tuned PostgreSQL configuration.
# Designed for a server with ~2 GB RAM and SSD storage.
# Adjust shared_buffers, effective_cache_size, and work_mem for your hardware.

# ─── Connections ──────────────────────────────────────────────────────────────
# Keep this low — PgBouncer handles client-side pooling.
# Actual server-side connections = default_pool_size × number_of_databases_in_use
max_connections = 100
superuser_reserved_connections = 3

# ─── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 256MB              # ~25% of RAM
effective_cache_size = 1536MB       # ~75% of RAM (planner hint, not allocated)
work_mem = 16MB                     # Per sort/hash node; multiply by max_connections for worst-case
maintenance_work_mem = 128MB        # VACUUM, CREATE INDEX, ALTER TABLE
huge_pages = off                    # Set to 'on' if the OS has huge pages configured

# ─── WAL & Checkpoints ────────────────────────────────────────────────────────
wal_level = replica                 # Required for streaming replication / logical decoding
max_wal_senders = 3
wal_keep_size = 512MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# Point-in-time recovery (PITR): uncomment and configure when ready
# archive_mode = on
# archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
# archive_timeout = 300

# ─── Query Planner ────────────────────────────────────────────────────────────
default_statistics_target = 100
random_page_cost = 1.1              # SSD; use 4.0 for spinning disks
effective_io_concurrency = 200      # SSD; use 2 for spinning disks

# ─── Logging ──────────────────────────────────────────────────────────────────
# Logs go to stderr and are captured by Docker's json-file driver (see compose logging config).
# The json-file driver handles rotation via max-size / max-file settings.
log_destination = 'stderr'
logging_collector = off

# What to log
log_min_duration_statement = 1000   # Log queries that take longer than 1000 ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                  # Log all temp file creation
log_autovacuum_min_duration = 250ms
log_error_verbosity = default

# Format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

# ─── Autovacuum ───────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05   # Trigger vacuum when 5% of table rows are dead
autovacuum_analyze_scale_factor = 0.02  # Trigger analyze when 2% of rows change

# ─── Security ─────────────────────────────────────────────────────────────────
password_encryption = scram-sha-256     # Default since PG14; do not change to md5

# ─── Locale & Time ────────────────────────────────────────────────────────────
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
