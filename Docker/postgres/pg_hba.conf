# pg_hba.conf — Client authentication configuration.
# Changes take effect with: SELECT pg_reload_conf();
#
# TYPE   DATABASE   USER   ADDRESS        METHOD

# Local Unix socket: trusted for the postgres superuser.
# Required by: healthchecks (pg_isready), docker-entrypoint-initdb.d scripts.
local    all        all                   trust

# Loopback — require SCRAM (used by admin tools connecting to 127.0.0.1)
host     all        all    127.0.0.1/32   scram-sha-256
host     all        all    ::1/128        scram-sha-256

# Docker bridge network — require SCRAM.
# Covers connections from PgBouncer, app containers, and the backup service.
host     all        all    0.0.0.0/0      scram-sha-256
