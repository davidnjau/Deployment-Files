# pgbouncer.ini — Production PgBouncer configuration.
# Reference: https://www.pgbouncer.org/config.html

[databases]
# Route all database names to the PostgreSQL backend.
# Apps connect to PgBouncer using their actual database name (e.g. app_db).
# To restrict to specific databases, replace '*' with explicit entries:
#   app_db = host=postgres port=5432 dbname=app_db
* = host=postgres port=5432

[pgbouncer]
# ─── Network ──────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =

# ─── Authentication ───────────────────────────────────────────────────────────
# scram-sha-256: most secure; requires PgBouncer ≥ 1.19 and PostgreSQL ≥ 14.
auth_type = scram-sha-256

# userlist.txt holds only the auth_user credentials (generated at container startup
# by generate_userlist.sh — never committed to version control).
auth_file = /etc/pgbouncer/userlist.txt

# PgBouncer connects to PostgreSQL as auth_user to look up other users' passwords.
# This avoids maintaining a full copy of pg_shadow in userlist.txt.
auth_user = pgbouncer
auth_query = SELECT * FROM pgbouncer.get_auth($1)

# ─── Pooling ──────────────────────────────────────────────────────────────────
# 'transaction': server connection is returned to the pool after each transaction.
# Use 'session' if your application uses session-level features:
#   SET LOCAL, LISTEN/NOTIFY, advisory locks, prepared statements (non-protocol-level).
pool_mode = transaction

max_client_conn = 1000          # Maximum simultaneous client connections to PgBouncer
default_pool_size = 25          # Server connections per (database, user) pair
min_pool_size = 5               # Minimum connections kept open when idle
reserve_pool_size = 10          # Extra connections for reserve_pool_timeout
reserve_pool_timeout = 3.0      # Seconds to wait before using reserve pool (sec)
max_db_connections = 100        # Cap on total server-side connections per database
max_user_connections = 0        # 0 = no per-user cap

# ─── Timeouts (seconds) ───────────────────────────────────────────────────────
server_connect_timeout = 15     # Abort if a new server connection takes longer
server_login_retry = 15         # Retry interval after a failed server connection
query_timeout = 0               # 0 = disabled; set per-application if needed
query_wait_timeout = 120        # Drop client if it waits this long for a server connection
client_idle_timeout = 0         # 0 = disabled; disconnect idle clients after N seconds
server_idle_timeout = 600       # Close idle server connections after 10 minutes
idle_transaction_timeout = 30   # Disconnect client in idle-in-transaction after 30s (prevents locks)
server_lifetime = 3600          # Recycle server connections after 1 hour
client_login_timeout = 60       # Drop client if login takes longer than this

# ─── Server management ────────────────────────────────────────────────────────
server_reset_query = DISCARD ALL        # Reset server state between clients (transaction pool)
server_check_query = select 1           # Lightweight liveness check for idle connections
server_check_delay = 30.0              # How often to run server_check_query (seconds)

# ─── Logging ──────────────────────────────────────────────────────────────────
# PgBouncer logs to stdout/stderr, captured by Docker's json-file driver.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60               # Log pool stats every 60 seconds

# ─── Admin interface ──────────────────────────────────────────────────────────
# Connect to the special 'pgbouncer' database to run SHOW POOLS, SHOW STATS, etc.
# Example: psql -h localhost -p 6432 -U pgbouncer pgbouncer
admin_users = pgbouncer
stats_users = pgbouncer

# ─── TLS ──────────────────────────────────────────────────────────────────────
# Uncomment when TLS certificates are provisioned (strongly recommended in production).
# Client → PgBouncer
# client_tls_sslmode = require
# client_tls_cert_file = /etc/pgbouncer/server.crt
# client_tls_key_file  = /etc/pgbouncer/server.key
# client_tls_ca_file   = /etc/pgbouncer/ca.crt
#
# PgBouncer → PostgreSQL
# server_tls_sslmode = verify-full
# server_tls_ca_file = /etc/pgbouncer/ca.crt
