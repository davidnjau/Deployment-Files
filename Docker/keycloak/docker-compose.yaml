version: '3.8'

volumes:
  keycloak-postgres:

networks:
  cloudbuild:
    driver: bridge

services:
  keycloak-postgres:
    image: postgres:14-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - cloudbuild
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - 'keycloak-postgres:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - cloudbuild
    ports:
      - "8999:8080"
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Admin credentials — only used on first boot
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Hostname (required for production mode)
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PROXY: edge
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    # 'start' enables production hardening (no dev-mode shortcuts)
    # Add --optimized if you pre-built the image with build-time options
    command: start
